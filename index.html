function csv(t){var R=[],r=[],c='',q=false,i=0;for(;i<t.length;i++){var ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
if(c!==''||r.length){r.push(c);R.push(r)}return R}
function num(x){var s=String(x||'').replace(/[^\d.,-]/g,'');if(/^-?\d+\.\d{1,2}$/.test(s))return parseFloat(s);return parseInt(s.replace(/[.,]/g,''),10)||0}
function dt(x){x=String(x||'').trim();var m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return ('0'+m[1]).slice(-2)+'/'+('0'+m[2]).slice(-2)+'/'+m[3];m=x.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:''}
function parse(t){var R=csv(t),out=[];for(var i=1;i<R.length;i++){var r=R[i],d=dt(r[1]);if(!d)continue;function s(j){return String(r[j]==null?'':r[j]).trim()}
var o=[d,s(2),s(3),s(4),num(r[12]),s(14),s(15),s(16),s(17),s(18),s(19),s(21),s(22),s(23),s(24)];if(o[11]||o[12]||o[13]||o[14]||o[10]==='SPK Fisik Hilang')out.push(o)}return out}

function refresh(){if(typeof fetch!=='function'){setSt('err','Browser tidak mendukung fetch');return}var src=SRC,mm=src.match(/\/d\/([\w-]+)/),id=mm?mm[1]:src;setSt('load');
